# Dependabot keeps GitHub Actions and Docker base images current.
# Go modules: not applicable (Yagura has zero external Go dependencies per ADR-0001).
#
# Supply-chain delay: a `cooldown` holds back freshly-published versions so that a
# malicious release that gets yanked shortly after publication is never pulled in.
# This is the Dependabot equivalent of npm `min-release-age` / pnpm `minimumReleaseAge`
# / Renovate `minimumReleaseAge` (S2.5, "don't take a release the moment it ships").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: build
      include: scope
