# golangci-lint configuration for Yagura.
# Covers OSPS-VM-06.02 (automated SAST evaluation policy).
version: '2'

run:
  timeout: 5m
  tests: true
  go: '1.22'

linters:
  default: none
  enable:
    - errcheck       # unchecked errors are a common bug source
    - gosec          # security-focused issues
    - govet          # vet built-in
    - ineffassign    # ineffectual assignments
    - misspell       # misspellings in comments
    - revive         # general-purpose linter
    - staticcheck    # comprehensive static analysis
    - unconvert      # redundant type conversions
    - unused         # unused symbols
    - bodyclose      # response.Body must be closed
    - errorlint      # proper errors.Is / errors.As
    - gocritic       # opinionated style checks
    - copyloopvar    # loop variable capture (Go 1.22+)
    - nilerr         # returning nil after !=nil check
    - prealloc       # slice prealloc hints
    - whitespace     # unnecessary blank lines
    - usestdlibvars  # use stdlib constants over magic strings
  settings:
    errcheck:
      check-blank: false
    gosec:
      excludes:
        - G115  # integer overflow conversion uint64 -> int64 in metrics (intended)
        - G304  # file inclusion via variable (controlled paths only)
    govet:
      enable-all: true
      disable:
        - fieldalignment  # too aggressive for readability
        - shadow          # idiomatic in some cases
    revive:
      rules:
        - name: exported
          arguments: [{ checkPrivateReceivers: false }]
        - name: var-naming
        - name: unused-parameter
          arguments: [{ allowRegex: '^_' }]
        - name: package-comments
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
    staticcheck:
      checks: ['all', '-ST1000']  # ST1000: at least one file in package has package comment
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - ifElseChain
        - hugeParam
  exclusions:
    rules:
      # Tests can use t.TempDir() without explicit cleanup, and may have
      # less stringent error handling than production code
      - path: _test\.go
        linters: [errcheck, gosec, gocritic, revive]
      # cmd/main can use fmt.Print* freely
      - path: cmd/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
