# OpenSSF Scorecard analysis.
# Publishes results to https://scorecard.dev for the repo badge.
name: scorecard

on:
  branch_protection_rule: {}
  schedule:
    - cron: '17 3 * * 2'  # Tuesdays at 03:17 UTC
  push:
    branches: [main]

permissions: read-all

# NOTE (v1.86.0): this workflow lives at the REPOSITORY ROOT because that is the
# only place GitHub registers workflows from. It used to sit inside the gitignored
# yagura-v0.35.0/ tree, so it was never committed, never registered, and never ran:
# `list_workflows` returned total_count 0 for this repository.
#
# No working-directory default is set here: every step is a `uses:` action, and
# `defaults.run` would apply to nothing. The Go module lives in yagura-v0.35.0/,
# which the action discovers by scanning the workspace.

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46  # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.27.5
        with:
          sarif_file: results.sarif
