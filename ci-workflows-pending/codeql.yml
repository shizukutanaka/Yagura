# CodeQL static analysis for Go.
# Satisfies OSPS-VM-06.02 (automated SAST evaluation on every change).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'  # Mondays at 04:37 UTC

permissions:
  contents: read

# NOTE (v1.86.0): this workflow lives at the REPOSITORY ROOT because that is the
# only place GitHub registers workflows from. It used to sit inside the gitignored
# yagura-v0.35.0/ tree, so it was never committed, never registered, and never ran:
# `list_workflows` returned total_count 0 for this repository.
#
# No working-directory default is set here: every step is a `uses:` action, and
# `defaults.run` would apply to nothing. The Go module lives in yagura-v0.35.0/,
# which the action discovers by scanning the workspace.

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.27.5
        with:
          languages: go
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.27.5
      - uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.27.5
        with:
          category: '/language:go'
